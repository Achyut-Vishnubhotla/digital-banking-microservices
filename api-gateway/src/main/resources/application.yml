server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**,/oauth2/**,/login/oauth2/**
        - id: account-service
          uri: ${ACCOUNT_URL:http://localhost:8082}
          predicates:
            - Path=/api/accounts/**,/api/transfers/**

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
