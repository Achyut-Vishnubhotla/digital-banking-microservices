services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build: ./auth-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-disabled}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-disabled}
      FRONTEND_URL: http://localhost:3000
      OAUTH_REDIRECT_URI: http://localhost:3000/login/oauth2/code/github
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build: ./account-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/accountdb
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    environment:
      AUTH_URL: http://auth-service:8081
      ACCOUNT_URL: http://account-service:8082
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - account-service

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  pgdata:
